name: test-build

# Manual-only entry: rewrite the package to a unique test version built from
# the current stable version (<base>-test.<run_id>.<run_attempt>), build, pack
# the tarball and upload it together with a SHA256 manifest. Publishing never
# happens here: npm Trusted Publishing only allows one CI workflow per package,
# so the actual publish is done solely by npm-publish.yml through workflow_run.
"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read test version
        id: test-version
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { appendFileSync, readFileSync } from "node:fs"
          const pkg = JSON.parse(readFileSync("package.json", "utf8"))
          const base = pkg.version.replace(/[-+].*$/, "")
          const version = `${base}-test.${process.env.GITHUB_RUN_ID}.${process.env.GITHUB_RUN_ATTEMPT}`
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`)
          console.log(`test version: ${version}`)
          EOF

      - name: Rewrite package to the test version
        env:
          TEST_VERSION: ${{ steps.test-version.outputs.version }}
        run: |
          set -euo pipefail
          # Heredoc with a quoted delimiter: bash passes the body through
          # verbatim, so single quotes, backticks and $ in the JS are safe.
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs"
          const version = process.env.TEST_VERSION
          const file = "package.json"
          const pkg = JSON.parse(readFileSync(file, "utf8"))
          pkg.version = version
          writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n")
          console.log(`rewritten to ${version}`)
          EOF
          # Re-resolve so the lockfile stays consistent with the rewritten
          # manifest.
          pnpm install

      - name: Build
        run: pnpm run build

      - name: Pack tarball
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/plugin-packages"
          pnpm pack --pack-destination "$RUNNER_TEMP/plugin-packages"

      - name: Write manifest
        env:
          PACK_VERSION: ${{ steps.test-version.outputs.version }}
          PACK_DIR: ${{ runner.temp }}/plugin-packages
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { createHash } from "node:crypto"
          import { existsSync, readFileSync, writeFileSync } from "node:fs"
          const pkg = JSON.parse(readFileSync("package.json", "utf8"))
          const version = pkg.version
          if (process.env.PACK_VERSION !== version) {
            throw new Error(
              `package version ${version} does not match expected ${process.env.PACK_VERSION}`
            )
          }
          const base = pkg.name.replace(/^@/, "").replace(/\//g, "-")
          const file = `${base}-${version}.tgz`
          const path = `${process.env.PACK_DIR}/${file}`
          if (!existsSync(path)) {
            throw new Error(`missing tarball: ${path}`)
          }
          const sha256 = createHash("sha256")
            .update(readFileSync(path))
            .digest("hex")
          const packages = [{ name: pkg.name, file, sha256 }]
          const manifest = { mode: "test", version, packages }
          writeFileSync(
            `${process.env.PACK_DIR}/manifest.json`,
            JSON.stringify(manifest, null, 2) + "\n"
          )
          console.log(`manifest: ${packages.length} package @ ${version}`)
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: plugin-packages
          path: ${{ runner.temp }}/plugin-packages
          retention-days: 14
